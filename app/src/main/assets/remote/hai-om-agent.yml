name: HAI OM Agent

on:
  push:
    branches:
      - "hai-agent/**"

permissions:
  contents: write

jobs:
  agent:
    if: contains(github.event.head_commit.message, 'agent(remote-bootstrap):')
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start free AI engine
        shell: bash
        run: |
          set -euo pipefail
          npm install -g omniroute@latest --no-fund --no-audit
          OMNIROUTE_SERVER_HOST=127.0.0.1 nohup omniroute --no-open > "$RUNNER_TEMP/omniroute.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/omniroute.pid"

          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:20128/api/health/ping >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" != "1" ]; then
            cat "$RUNNER_TEMP/omniroute.log" || true
            exit 1
          fi

          # Add a known keyless provider explicitly. This avoids relying on the
          # zero-config pool, whose members can reject CI/server traffic.
          omniroute providers add pollinations             --allow-no-credential             --yes             --name hai-free-pollinations             --default-model qwen-coder || true

          # Enable MCP locally so compression CLI commands use the normal supported
          # management path, then enable stacked RTK + Caveman compression.
          omniroute mcp enable || true
          omniroute compression engine set stacked ||             omniroute compression engine set rtk || true

          # Give the provider auto-test a moment to mark the connection active.
          for i in $(seq 1 20); do
            if curl -fsS               -H "Authorization: Bearer hai-om-free"               http://127.0.0.1:20128/v1/models               | grep -q '"pol/qwen-coder"'; then
              break
            fi
            sleep 2
          done

      - name: Build, test, and repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HAI_OMNIROUTE_URL: http://127.0.0.1:20128
          HAI_BRANCH: ${{ github.ref_name }}
          HAI_REPOSITORY: ${{ github.repository }}
        run: node .hai-om/agent.mjs

      - name: Stop AI engine
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/omniroute.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/omniroute.pid")" 2>/dev/null || true
          fi
