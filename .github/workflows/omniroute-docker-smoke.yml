name: OmniRoute Docker perf smoke

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Pull and start OmniRoute image
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          docker pull diegosouzapw/omniroute:3.8.50
          PULL_DONE=$(date +%s)
          mkdir -p "$RUNNER_TEMP/omniroute-data"
          chmod 777 "$RUNNER_TEMP/omniroute-data"
          docker run -d --name omniroute             -p 127.0.0.1:20128:20128             -e REQUIRE_API_KEY=false             -v "$RUNNER_TEMP/omniroute-data:/app/data"             diegosouzapw/omniroute:3.8.50
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:20128/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          READY=$(date +%s)
          echo "pull_seconds=$((PULL_DONE-START))"
          echo "ready_seconds=$((READY-START))"
          curl -fsS http://127.0.0.1:20128/healthz
          echo
          docker exec omniroute sh -lc 'find /app -maxdepth 3 -type f \( -name "api.mjs" -o -name "sqlite.mjs" -o -name "omniroute.mjs" \) | head -30'
          docker exec omniroute sh -lc 'ls -la /app/bin 2>/dev/null || true; ls -la /app/dev 2>/dev/null | head || true'

      - name: Stop
        if: always()
        run: docker rm -f omniroute || true
