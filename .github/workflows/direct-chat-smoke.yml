name: Direct chat smoke

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Kilo anonymous chat
        shell: bash
        run: |
          set -euo pipefail
          START="$(date +%s)"

          RESPONSE="$(curl -fsS --max-time 90             https://api.kilo.ai/api/openrouter/chat/completions             -H 'Authorization: Bearer anonymous'             -H 'X-KILOCODE-EDITORNAME: HAI OM'             -H 'Content-Type: application/json'             -d '{"model":"openrouter/free","stream":false,"max_tokens":64,"messages":[{"role":"user","content":"Reply with exactly HAI_CHAT_OK"}]}')"

          echo "$RESPONSE" | jq -e '.choices[0].message.content | strings | length > 0' >/dev/null
          END="$(date +%s)"
          echo "direct_chat_seconds=$((END-START))"
