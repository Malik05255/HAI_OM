name: OmniRoute smoke

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and start OmniRoute
        shell: bash
        run: |
          set -euo pipefail
          npm install -g omniroute@latest --no-fund --no-audit
          OMNIROUTE_SERVER_HOST=127.0.0.1 nohup omniroute --no-open > "$RUNNER_TEMP/omniroute.log" 2>&1 &
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:20128/api/health/ping >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            cat "$RUNNER_TEMP/omniroute.log" || true
            exit 1
          fi

      - name: Enable compression and test free routing
        shell: bash
        run: |
          set -euo pipefail

          omniroute providers add pollinations \
            --allow-no-credential \
            --yes \
            --name hai-free-pollinations \
            --default-model qwen-coder || true

          omniroute mcp enable || true
          omniroute compression engine set stacked || \
            omniroute compression engine set rtk || true

          for i in $(seq 1 20); do
            if curl -fsS \
              -H "Authorization: Bearer smoke" \
              http://127.0.0.1:20128/v1/models \
              | grep -q '"pol/qwen-coder"'; then
              break
            fi
            sleep 2
          done

          try_model() {
            MODEL="$1"
            HTTP_CODE="$(curl -sS --max-time 180               -o "$RUNNER_TEMP/response.json"               -w "%{http_code}"               http://127.0.0.1:20128/v1/chat/completions               -H "Authorization: Bearer smoke"               -H "Content-Type: application/json"               -d "{\"model\":\"$MODEL\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly: HAI_OM_OK\"}]}")"

            if [ "$HTTP_CODE" = "200" ] &&                jq -e '.choices[0].message.content | strings | length > 0' "$RUNNER_TEMP/response.json" >/dev/null 2>&1; then
              echo "Working route: $MODEL"
              jq -r '.model // "'"$MODEL"'"' "$RUNNER_TEMP/response.json"
              return 0
            fi

            echo "$MODEL failed with HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/response.json" || true
            return 1
          }

          try_model "pol/qwen-coder" || \
          try_model "pol/deepseek" || \
          try_model "pol/openai-large" || \
          try_model "pol/grok" || \
          try_model "auto/coding" || \
          try_model "auto"
