name: OmniRoute smoke

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and start OmniRoute
        shell: bash
        run: |
          set -euo pipefail
          npm install -g omniroute@latest --no-fund --no-audit
          OMNIROUTE_SERVER_HOST=127.0.0.1 nohup omniroute --no-open > "$RUNNER_TEMP/omniroute.log" 2>&1 &
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:20128/api/health/ping >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            cat "$RUNNER_TEMP/omniroute.log" || true
            exit 1
          fi

      - name: Verify free-only routing and compression
        shell: bash
        run: |
          set -euo pipefail

          OMNIROOT="$(npm root -g)/omniroute"
          export OMNIROOT
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const { apiFetch } = await import(
            pathToFileURL(path.join(process.env.OMNIROOT, "bin/cli/api.mjs")).href
          );

          const settings = await apiFetch("/api/settings", {
            method: "PATCH",
            body: { freeAccessPolicy: "strict", excludeTosAvoid: false },
            retry: false,
          });
          if (!settings.ok) throw new Error("strict free-only settings failed: " + settings.status);

          const compression = await apiFetch("/api/settings/compression", {
            method: "PUT",
            body: {
              defaultMode: "stacked",
              autoTriggerMode: "stacked",
              autoTriggerTokens: 32000,
              stackedPipeline: [
                { engine: "rtk", intensity: "standard" },
                { engine: "caveman", intensity: "full" }
              ]
            },
            retry: false,
          });
          if (!compression.ok) throw new Error("compression settings failed: " + compression.status);

          try {
            const tokenRes = await apiFetch("/api/dahl/tokens", { method: "POST", retry: false });
            if (tokenRes.ok) {
              const body = await tokenRes.json();
              if (typeof body?.token === "string" && body.token.length > 8) {
                fs.writeFileSync(
                  path.join(process.env.RUNNER_TEMP, "dahl-token"),
                  body.token,
                  { mode: 0o600 }
                );
              }
            }
          } catch {}
          NODE

          if [ -s "$RUNNER_TEMP/dahl-token" ]; then
            export HAI_DAHL_TOKEN="$(cat "$RUNNER_TEMP/dahl-token")"
            omniroute providers add dahl \
              --credential-env HAI_DAHL_TOKEN \
              --yes \
              --name hai-free-dahl \
              --default-model moonshotai/Kimi-K2.6 || true
            omniroute providers test hai-free-dahl || true
            unset HAI_DAHL_TOKEN
            rm -f "$RUNNER_TEMP/dahl-token"
          fi

          try_model() {
            MODEL="$1"
            HTTP_CODE="$(curl -sS --max-time 45 \
              -o "$RUNNER_TEMP/response.json" \
              -w "%{http_code}" \
              http://127.0.0.1:20128/v1/chat/completions \
              -H "Authorization: Bearer smoke" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$MODEL\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly: HAI_OM_OK\"}]}")"

            if [ "$HTTP_CODE" = "200" ] && \
               jq -e '.choices[0].message.content | strings | length > 0' "$RUNNER_TEMP/response.json" >/dev/null 2>&1; then
              echo "Working free route: $MODEL"
              return 0
            fi

            echo "$MODEL failed with HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/response.json" || true
            return 1
          }

          # Quality-first coding fallbacks, all zero-cost/no-user-input.
          try_model "dahl/moonshotai/Kimi-K2.6" || \
          try_model "unc/qwen3.6:27b" || \
          try_model "kc/openrouter/free" || \
          try_model "ddgw/gpt-5.6-luna" || \
          try_model "ddgw/claude-haiku-4-5" || \
          try_model "unc/adamo1139/Hermes-3-Llama-3.1-8B-FP8-Dynamic"
